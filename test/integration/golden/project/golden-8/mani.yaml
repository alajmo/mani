---
# Lists at the indentation of their key, as many formatters write them.
# Nothing but the edited project may change.

import:
- shared.yaml

projects:
  alpha:
    url: git@github.com:acme/alpha.git
    tags:
    - public
    - go
    desc: Alpha service

  delta:
    url: git@github.com:acme/delta.git
    desc: "first line\nsecond line"

tasks:
  build:
    env:
      MODE: production
    commands:
    - name: lint
      cmd: echo lint
    - cmd: |
        echo build
        echo done
    desc: Build
