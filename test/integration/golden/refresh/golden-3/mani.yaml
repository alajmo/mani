# `legacy` is owned by the acme remote but is missing from its listing. The
# listing of an organization only shows what the account that is logged in can
# see, so it may be gone or be a private repo: `refresh` reports it as possibly
# gone, and `refresh --prune` keeps it.
# `vendored` belongs to a different remote and must never be pruned.

sources:
  - source: github-org/acme

projects:
  alpha:
    url: git@github.com:acme/alpha.git
    desc: Alpha service
    tags: [public, go, api]

  beta:
    url: git@github.com:acme/beta.git
    desc: Beta worker
    tags: [private, go]

  gamma:
    url: git@github.com:acme/gamma.git
    tags: [archived, public]

  # not in the listing of the organization — reported as possibly gone.
  legacy:
    url: git@github.com:acme/legacy.git
    desc: Decommissioned service

  # different remote — pruning must leave this alone.
  vendored:
    url: git@github.com:other-org/vendored.git
    desc: Third-party dependency

tasks:
  hello:
    desc: Print Hello World
    cmd: echo "Hello World"
