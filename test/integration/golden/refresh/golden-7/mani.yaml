# Sources-less config, as produced by a plain `mani init`.
# Refresh must discover the repos cloned into the workspace by hand and
# append them while leaving this comment and the existing project untouched.

projects:
  # hand-written, keep as-is
  alpha:
    url: git@github.com:acme/alpha.git
    tags: [core]

  lib:
    path: nested/lib
    url: https://github.com/acme/lib

  newrepo:
    url: https://github.com/acme/newrepo

tasks:
  hello:
    desc: Print Hello World
    cmd: echo "Hello World"
